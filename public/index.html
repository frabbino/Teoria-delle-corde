function stringbed(pat, mode, size){
  const dims = {"16x19":[16,19],"18x20":[18,20],"18x19":[18,19],"16x20":[16,20],"16x18":[16,18],"18x16":[18,16],"16x17":[16,17],"open":[16,16]};
  const [mains,cross] = dims[pat] || [16,19];
  const P="var(--court)", S="var(--cross)";
  const mc = mode==="rhybrid"||mode==="soft" ? S : P;
  const cc = mode==="hybrid"||mode==="soft" ? S : P;
  const w=200,h=260,cx=100,cy=125,rx=78,ry=100;
  let lines="";
  for(let i=0;i<mains;i++){const x=cx-rx+(2*rx)*(i+0.5)/mains;const dy=ry*Math.sqrt(Math.max(0,1-((x-cx)/rx)**2));
    lines+=`<line x1="${x.toFixed(1)}" y1="${(cy-dy+4).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(cy+dy-4).toFixed(1)}" stroke="${mc}" stroke-width="1.6"/>`;}
  for(let j=0;j<cross;j++){const y=cy-ry+(2*ry)*(j+0.5)/cross;const dx=rx*Math.sqrt(Math.max(0,1-((y-cy)/ry)**2));
    lines+=`<line x1="${(cx-dx+4).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(cx+dx-4).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${cc}" stroke-width="1.6" opacity=".85"/>`;}
  return `<svg viewBox="0 0 ${w} ${h}" width="${size}" role="img" aria-label="Piatto corde ${mains} per ${cross}">
    <rect x="${cx-7}" y="${cy+ry+6}" width="14" height="${h-(cy+ry+6)}" rx="5" fill="var(--line)"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx+7}" ry="${ry+7}" fill="none" stroke="var(--ink)" stroke-width="7"/>
    ${lines}
    <circle cx="${cx+30}" cy="${cy-38}" r="15" fill="var(--ball)"/>
    <path d="M${cx+17} ${cy-44} q13 6 26 0 M${cx+17} ${cy-31} q13 -6 26 0" fill="none" stroke="var(--paper)" stroke-width="1.6"/>
  </svg>`;
}

function tensionBar(lo, hi, t, range){
  const min=Math.min(18,Math.floor(lo/2)*2), max=Math.max(30,Math.ceil(hi/2)*2), Wd=600, x=v=>20+(v-min)/(max-min)*(Wd-40);
  let s=`<svg class="tbar" viewBox="0 0 ${Wd} 74" width="100%" role="img" aria-label="Tensione consigliata ${kg(lo)}–${kg(hi)} kg${range?`, range del produttore ${range[0]}–${range[1]} kg`:""}">`;
  s+=`<rect x="20" y="30" width="${Wd-40}" height="10" rx="5" fill="var(--court-soft)"/>`;
  if(range) s+=`<rect x="${x(range[0])}" y="25" width="${x(range[1])-x(range[0])}" height="20" rx="5" fill="none" stroke="var(--court)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s+=`<rect x="${x(lo)}" y="30" width="${Math.max(6,x(hi)-x(lo))}" height="10" rx="5" fill="var(--ball)" stroke="var(--ball-ink)" stroke-width="1"/>`;
  s+=`<line x1="${x(t)}" x2="${x(t)}" y1="22" y2="48" stroke="var(--ink)" stroke-width="2"/>`;
  for(let v=min; v<=max; v+=2) s+=`<text x="${x(v)}" y="64" text-anchor="middle">${v}</text>`;
  s+=`<text class="lab" x="${x(t)}" y="15" text-anchor="middle">${kg(t)} kg</text></svg>`;
  return s;
}

/* Selezione dei modelli di corda */
function closestG(list,target){
  if(!list.length) return null;
  return list.reduce((a,b)=>{const da=Math.abs(a-target),db=Math.abs(b-target);return (db<da-1e-9||(Math.abs(db-da)<1e-9&&b>a))?b:a;});
}
function gaugeBonus(s,target){const c=closestG(s.g,target);if(c==null)return -0.5;const d=Math.abs(c-target);return d<0.005?1:d<=0.03?0.5:-0.5;}
function polyScore(s,ctx,focus){
  const T=s.twu; let sc=T?0:-1.5;
  const stiff=T?T.s:210, loss=T?T.l:35, spin=T?T.sp:null;
  if(focus==="spin"||ctx.spinWanted) sc+=spin==null?-1.5:(spin-6)*1.5;
  if(focus==="cross") sc+=(spin==null?-1:(spin-6))+(215-stiff)/15;
  if(ctx.comfort) sc+=(205-stiff)/8;
  if(ctx.control) sc+=(stiff-205)/20;
  sc+=(35-loss)/8;
  if(ctx.durable&&loss<=30) sc+=1;
  return sc;
}
function softScore(s,ctx){
  const tier=s.p>=18?3:s.p>=11?2:1; let sc=0;
  if(ctx.cap>=40) sc+=tier; else if(ctx.cap>=20) sc+=tier===2?2:tier===1?1:0; else sc+=tier===1?2:0;
  if(ctx.durable&&s.g.length&&Math.max(...s.g)>=1.32) sc+=1.5;
  if(ctx.comfort&&tier>=2) sc+=0.5;
  return sc;
}
/* Varietà di marche: prima la migliore di ogni marca, purché non troppo lontana dalla prima scelta */
function pickDiverse(scored,n,margin){
  if(!scored.length) return [];
  const topSc=scored[0].sc, out=[], cnt={};
  for(const x of scored){ if(out.length>=n||x.sc<topSc-margin) break; if(cnt[x.s.b]) continue; out.push(x); cnt[x.s.b]=1; }
  for(const x of scored){ if(out.length>=n) break; if(out.includes(x)||(cnt[x.s.b]||0)>=2) continue; out.push(x); cnt[x.s.b]=(cnt[x.s.b]||0)+1; }
  return out.concat(scored.filter(x=>!out.includes(x))).map(x=>x.s);
}
function pickModels(best,gM,gC,ctx){
  const pool=t=>STRINGS.filter(s=>s.t===t);
  if(best==="hybrid"||best==="rhybrid"){
    let mains, crosses;
    if(best==="hybrid"){
      mains=pool("poly").map(s=>({s,sc:polyScore(s,{...ctx,control:true},"control")+gaugeBonus(s,gM)}));
      crosses=pool("multi").map(s=>({s,sc:softScore(s,{...ctx,comfort:true})+gaugeBonus(s,gC)}));
    } else {
      const soft=ctx.cap>=40?pool("gut").concat(pool("multi")):pool("multi");
      mains=soft.map(s=>({s,sc:softScore(s,{...ctx,comfort:true})+(s.t==="gut"?1.5:0)+gaugeBonus(s,gM)}));
      crosses=pool("poly").filter(s=>s.twu).map(s=>({s,sc:polyScore(s,{...ctx,comfort:false,control:false},"cross")+gaugeBonus(s,gC)}));
    }
    mains.sort((a,b)=>b.sc-a.sc); crosses.sort((a,b)=>b.sc-a.sc);
    const combos=[], seen=new Set();
    const push=(m,c,force)=>{const key=m.s.n+"|"+c.s.n, cost=(m.s.p+c.s.p)/2;
      if(seen.has(key)||(!force&&cost>ctx.cap)) return; seen.add(key); combos.push({m:m.s,c:c.s,cost,sc:m.sc+c.sc});};
    // abbinamenti "in diagonale": i migliori di ogni lista tra loro, per avere varietà
    for(let i=0;i<Math.max(mains.length,crosses.length)&&combos.length<6;i++) push(mains[i%mains.length],crosses[i%crosses.length]);
    const all=[]; mains.slice(0,8).forEach(m=>crosses.slice(0,8).forEach(c=>all.push([m,c])));
    all.sort((a,b)=>(b[0].sc+b[1].sc)-(a[0].sc+a[1].sc)).forEach(([m,c])=>{if(combos.length<10) push(m,c);});
    let overBudget=false;
    if(!combos.length){overBudget=true;
      all.sort((a,b)=>(a[0].s.p+a[1].s.p)-(b[0].s.p+b[1].s.p)).slice(0,6).forEach(([m,c])=>push(m,c,true));}
    return {kind:"hybrid",items:combos,overBudget};
  }
  const t=best==="shaped"?"poly":best;
  const focus=best==="shaped"?"spin":"control";
  let base=pool(t);
  if(focus==="spin"){ // per il poliestere da spin: solo corde con potenziale di spin misurato almeno medio
    const hi=base.filter(s=>s.twu&&s.twu.sp>=6), mid=base.filter(s=>s.twu&&s.twu.sp>=5.5);
    base=hi.filter(s=>s.p<=ctx.cap).length>=4?hi:mid.filter(s=>s.p<=ctx.cap).length>=3?mid:base;
  }
  const items=base.map(s=>({s,sc:(t==="poly"?polyScore(s,ctx,focus):softScore(s,ctx))+gaugeBonus(s,gM)}));
  const capped=items.filter(x=>x.s.p<=ctx.cap);
  const overBudget=!capped.length;
  const scored=(capped.length?capped:items).sort((a,b)=>b.sc-a.sc);
  return {kind:"single",items:pickDiverse(scored,6,2),overBudget};
}
const gaugeLabel=(s,target)=>{
  if(!s.g.length) return s.gl?`Calibro ${s.gl}`:"Calibro: verifica in negozio";
  const c=closestG(s.g,target);
  return Math.abs(c-target)<0.005?`Calibro ${fmt(c)} mm`:`Calibro più vicino: ${fmt(c)} mm (consigliato ${fmt(target)})`;
};
function twuTags(s){
  const T=s.twu; if(!T) return {tags:[],line:"Nessuna misura TWU disponibile per questo modello."};
  const tags=[T.s<=195?"Morbida":T.s<=220?"Rigidità media":"Rigida",
    T.l<=28?"Tiene bene la tensione":T.l<=38?"Tenuta media":"Perde più tensione"];
  if(T.sp!=null) tags.push(T.sp>=7?"Spin alto":T.sp>=5.5?"Spin medio":"Spin basso");
  return {tags,line:`Misure TWU a circa 23 kg, calibro ${fmt(T.g)}: rigidità ${Math.round(T.s)} lb/in · perdita di tensione ${num1(T.l)}%${T.sp!=null?` · spin ${num1(T.sp)}`:""}`};
}
function softTags(s){
  const tags=[s.p>=18?"Fascia alta":s.p>=11?"Fascia media":"Economica"];
  if(s.g.length&&Math.max(...s.g)>=1.32) tags.push("Calibro spesso, dura di più");
  return tags;
}

function compute(){
  const info=racketInfo(), hc=headCatOf(info.cm), stc=stiffCatOf(info), pat=info.p||"nd";
  const pain=A("pain"), cur=A("current"), curT=A("curT"), prio=A("prio"), brk=A("brk"), age=A("age"), budget=A("budget");
  const sc=KEYS.map(()=>0);
  const add=arr=>{if(arr) arr.forEach((v,i)=>sc[i]+=v);};
  add(W.level[A("level")]); add(W.age[age]); add(W.freq[A("freq")]); add(W.style[A("style")]);
  add(W.swing[A("swing")]); add(W.spin[A("spin")]); add(W.brk[brk]); add(W.pain[pain]); add(W.prio[prio]);
  add(W.pattern[pat]); add(W.head[hc]); add(W.stiff[stc]); add(W.budget[budget]);
  if(pain!=="no"&&stc==="stiff") add([-2,-2,0,0,0,-1,0]);
  if(prio==="keep"&&cur&&cur!=="nd") add(INERTIA[cur]);
  if(sessionFb){
    if(sessionFb.fb==="dura") add([-1,-1,1,1,0,0,0]);
    if(sessionFb.fb==="morbida") add([1,0,-1,-1,0,0,0]);
    if(sessionFb.fb==="giusta"){const i=KEYS.indexOf(sessionFb.type); if(i>=0) sc[i]+=2;}
  }

  // vincoli
  const excl={};
  if(age==="u14") ["poly","shaped","hybrid","rhybrid"].forEach(k=>excl[k]="Sotto i 14 anni niente poliestere");
  if(pain==="yes") ["poly","shaped"].forEach(k=>excl[k]=excl[k]||"Con fastidi frequenti niente poliestere pieno");
  if(budget==="low"||budget==="mid") excl.gut="Il budello naturale costa da 39,90 € a set";
  const ranked=KEYS.map((k,i)=>({k,s:sc[i],out:excl[k]||null})).sort((a,b)=>((a.out?1:0)-(b.out?1:0))||(b.s-a.s));
  const ok=ranked.filter(x=>!x.out);
  const best=ok[0].k, second=ok[1]?ok[1].k:null;

  // calibro
  const G=[1.18,1.2,1.23,1.25,1.28,1.3,1.35];
  const snap=g=>G.reduce((a,b)=>Math.abs(b-g)<Math.abs(a-g)?b:a);
  const dense=DENSE_PATS.includes(pat), open=OPEN_PATS.includes(pat);
  const polyG=()=>{let g=1.25;if(brk==="weeks")g=1.30;else if(brk==="month")g=1.28;else if(prio==="comfort"||prio==="power")g=1.23;if(dense)g-=0.02;if(open)g+=0.03;return snap(Math.min(1.30,Math.max(1.20,g)));};
  const softG=()=>brk==="weeks"||brk==="month"?1.35:(brk==="never"&&(prio==="power"||prio==="comfort"))?1.25:1.30;
  let gM,gC;
  if(best==="poly"||best==="shaped"){gM=gC=polyG();}
  else if(best==="hybrid"){gM=polyG();gC=1.30;}
  else if(best==="rhybrid"){gM=softG();gC=1.25;}
  else {gM=gC=softG();}

  // tensione
  const BASE={poly:22,shaped:22,hybrid:23,rhybrid:24,multi:24.5,gut:25,syn:24};
  const sameFam=!!(cur&&cur!=="nd"&&(FAM[cur]||[]).includes(best));
  let t=BASE[best], fromCurrent=false;
  if(sameFam&&curT&&curT!=="nd"){
    t=CUR_C[curT]+({control:1,power:-1,comfort:-1}[prio]||0)+(pain==="yes"?-1:pain==="some"?-0.5:0);
    fromCurrent=true;
  } else {
    if(pain==="some")t-=1; if(pain==="yes")t-=2;
    if(prio==="control")t+=1; if(prio==="power")t-=1.5; if(prio==="comfort")t-=1;
    if(hc==="small")t-=1; if(hc==="large")t+=1; if(hc==="xl")t+=1.5;
    if(dense)t-=0.5; if(open)t+=0.5;
    if(A("level")==="beg")t-=0.5;
    if(age==="u14")t-=1; if(age==="o55")t-=0.5;
    if(pain!=="no"&&stc==="stiff")t-=0.5;
  }
  const fbAdj=sessionFb?({dura:-1,morbida:1}[sessionFb.fb]||0):0;
  t=half(Math.min(28,Math.max(18,t+fbAdj)));
  let lo=t-1, hi=t+1, clamped=null;
  if(info.range){
    const [a,b]=info.range;
    if(t+1>b){t=b-1;clamped="down";}
    if(t-1<a){ if(a-(t-1)<=1){t=a+1;clamped="up";} else clamped="below"; }
    if(clamped!=="below"){t=Math.min(b,Math.max(a,t)); lo=Math.max(a,t-1); hi=Math.min(b,t+1);}
    else {lo=t-1; hi=t+1;}
  }
  const clampR=v=>info.range?Math.min(info.range[1],Math.max(info.range[0],v)):v;
  const rng=(a,b)=>a===b?`${kg(a)} kg`:`${kg(a)}–${kg(b)} kg`;
  let lines, lineNote;
  if(best==="hybrid"){
    lines=[["Verticali",`Poliestere ${fmt(gM)} mm`,rng(lo,hi)],["Orizzontali",`Multifilamento ${fmt(gC)} mm`,rng(clampR(lo+1),clampR(hi+1))]];
    lineNote="Orizzontali circa 1 kg più alte: la corda morbida tiene meglio una tensione un po' superiore. È una convenzione comune, l'incordatore può adattarla.";
  } else if(best==="rhybrid"){
    lines=[["Verticali",`Budello o multifilamento ${fmt(gM)} mm`,rng(lo,hi)],["Orizzontali",`Poliestere scivoloso ${fmt(gC)} mm`,rng(clampR(lo-1),clampR(hi-1))]];
    lineNote="Orizzontali circa 1 kg più basse, come si fa di solito con il poliestere in un ibrido. L'incordatore può adattarla.";
  } else {
    lines=[["Verticali e orizzontali",`${TYPES[best].s} ${fmt(gM)} mm`,rng(lo,hi)]];
    lineNote="Stessa tensione nelle due direzioni, oppure 0,5–1 kg in meno sulle orizzontali se l'incordatore lo preferisce.";
  }
  const gaugeTxt=gM===gC?fmt(gM):`${fmt(gM)} / ${fmt(gC)}`;
  const gaugeSub=gM===gC?"millimetri":"verticali / orizzontali, mm";

  // modelli di corda
  const ctx={cap:CAP[budget]??Infinity,spinWanted:A("spin")==="high"||prio==="spin",
    comfort:prio==="comfort"||pain==="some"||age==="o55"||age==="teen",
    control:prio==="control"||A("swing")==="long"||A("style")==="atk",
    durable:brk==="month"||brk==="weeks"||prio==="dur"};
  const models=pickModels(best,gM,gC,ctx);

  // affidabilità
  let unk=0;
  if(!info.known){ if(!info.cm)unk++; if(!info.p)unk++; if(stc==="nd")unk++; } else if(!info.range) unk++;
  if(!cur||cur==="nd") unk++; else if(!curT||curT==="nd") unk++;
  if(brk==="nd") unk++;
  const conf=unk<=1?"alta":unk<=3?"media":"bassa";
  const confTxt={alta:"Le risposte coprono i dati principali: è un buon punto di partenza.",
    media:"Alcune risposte erano «Non lo so»: fai verificare il consiglio dall'incordatore.",
    bassa:"Mancano diversi dati: usa il consiglio come orientamento e controlla la scheda della tua racchetta."}[conf];

  // confronto con la corda attuale
  let compare=null;
  if(cur&&cur!=="nd"){
    let tline=null;
    if(curT&&curT!=="nd"){const d=half(t-CUR_C[curT]); tline=d===0?"Stessa tensione di adesso":`Circa ${kg(Math.abs(d))} kg ${d>0?"in più":"in meno"} di adesso`;}
    compare={now:`${CURN[cur].charAt(0).toUpperCase()+CURN[cur].slice(1)}${curT&&curT!=="nd"?`, ${CURT_L[curT]}`:""}`,
      change:sameFam?`Resti su ${TYPES[best].s.toLowerCase()}`:`Passi a ${TYPES[best].s.toLowerCase()}`, tline};
  }

  // motivazioni
  const why=[];
  const L={beg:"sei agli inizi",int:"hai un livello intermedio",adv:"hai un livello avanzato",pro:"giochi a livello agonistico"};
  const F={f1:"una volta",f2:"due volte",f3:"3–4 volte",f5:"5 o più volte"};
  why.push(`Hai indicato che ${L[A("level")]} e giochi ${F[A("freq")]} a settimana.`);
  if(info.known) why.push(`La tua ${info.name} ha piatto da ${info.cm} cm², schema ${PAT[info.p]}${info.ra?` e rigidità RA ${info.ra}`:""}${info.range?`; il produttore indica ${info.range[0]}–${info.range[1]} kg`:""}.`);
  if(age==="u14") why.push("Sotto i 14 anni escludiamo il poliestere: servono corde elastiche che aiutino a spingere la palla, come indica Wilson.");
  if(age==="o55") why.push("Sopra i 55 anni conviene privilegiare il comfort, come indica Wilson.");
  if(pain==="yes") why.push("Con fastidi frequenti al braccio escludiamo il poliestere pieno e abbassiamo la tensione: con tensione più alta arrivano più sollecitazioni al gomito.");
  else if(pain==="some") why.push("I fastidi occasionali spingono verso una corda più morbida e una tensione un po' più bassa.");
  if(pain!=="no"&&stc==="stiff") why.push("Il telaio è rigido (RA 68 o più): con i fastidi al braccio conviene stare ancora più sul morbido.");
  if(A("spin")==="high"||prio==="spin") why.push("Cerchi rotazione: lo spin nasce soprattutto dallo snapback, cioè le corde verticali che scivolano di lato sulla palla e tornano in posizione. Contano corde che scorrono bene tra loro, non una superficie ruvida.");
  if(best==="hybrid") why.push("L'ibrido classico, con il poliestere in verticale, è pensato per durata e controllo. Per lo spin è meno adatto, perché le corde scorrono meno.");
  if(best==="rhybrid") why.push("Nell'ibrido invertito la corda morbida in verticale e il poliestere liscio in orizzontale scorrono bene tra loro: è la soluzione per unire rotazione e comfort.");
  if(brk==="weeks") why.push("Rompi le corde molto spesso: servono un materiale resistente e un calibro più spesso.");
  else if(brk==="month") why.push("Rompi le corde abbastanza spesso: meglio un calibro un po' più spesso della media.");
  if(A("swing")==="long") why.push("Uno swing lungo e veloce genera già molta potenza: una corda da controllo evita che la palla voli lunga.");
  if(A("swing")==="short") why.push("Uno swing compatto trae vantaggio da una corda elastica, che restituisce potenza con meno sforzo.");
  if(prio==="control") why.push("Cerchi controllo: la tensione sale di circa 1 kg. Con tensione più alta gli errori finiscono più spesso in rete che lunghi (Bower e Cross, 2005).");
  if(prio==="power") why.push("Cerchi potenza: la tensione scende. L'effetto esiste ma è piccolo: in uno studio circa 10 kg in meno davano circa 3 km/h in più alla palla (Bower e Cross, 2005).");
  if(prio==="keep"&&cur&&cur!=="nd") why.push("Ti trovi bene con la corda attuale: il consiglio resta il più vicino possibile alla tua impostazione.");
  if(!info.known&&(hc==="large"||hc==="xl")) why.push("Un piatto grande ha corde più lunghe ed elastiche: si compensa con una tensione un po' più alta.");
  if(!info.known&&hc==="small") why.push("Un piatto piccolo è già più rigido e controllato: si compensa con una tensione un po' più bassa.");
  if(dense) why.push("Uno schema fitto è più rigido: calibro un po' più sottile e tensione leggermente più bassa.");
  if(open) why.push("Uno schema aperto dà più spin ma consuma prima le corde: calibro un po' più spesso.");
  if(budget==="low"||budget==="mid") why.push("Con il budget scelto escludiamo il budello naturale, che costa da 39,90 € a set.");
  if(fromCurrent) why.push("Resti sullo stesso tipo di corda: partiamo dalla tua tensione attuale e la spostiamo nella direzione che cerchi.");
  if(fbAdj) why.push(fbAdj<0?"La volta scorsa la corda era troppo dura: abbiamo tolto circa 1 kg.":"La volta scorsa la corda era troppo morbida: abbiamo aggiunto circa 1 kg.");
  if(sessionFb&&sessionFb.fb==="giusta") why.push("La volta scorsa ti sei trovato bene: il consiglio resta vicino al precedente.");
  if(clamped==="down") why.push(`Abbiamo abbassato la tensione per non superare il massimo indicato dal produttore della tua racchetta (${info.range[1]} kg).`);
  if(clamped==="up") why.push(`Abbiamo alzato leggermente la tensione per restare nel range del produttore (${info.range[0]}–${info.range[1]} kg).`);
  if(clamped==="below") why.push(`La tensione consigliata è sotto il range del produttore (${info.range[0]}–${info.range[1]} kg). ${["poly","shaped","hybrid","rhybrid"].includes(best)?"Con il poliestere è comune incordare più basso del range: ":""}parlane con l'incordatore prima di montarla.`);
  why.push("Ti diamo un range e non un numero secco: anche i giocatori d'élite faticano a sentire differenze di 2–3 kg (Bower e Cross, 2008). Conta di più tenerla costante.");

  // cambio corde
  const sess={f1:1,f2:2,f3:3.5,f5:5}[A("freq")]||2;
  const polyish=["poly","shaped","hybrid","rhybrid"].includes(best);
  let weeks, freqTxt;
  if(polyish){weeks=Math.max(1,Math.round(17.5/(sess*1.5)));
    freqTxt=`Il poliestere va cambiato ogni 15–20 ore di gioco anche se non si rompe: con il tuo ritmo circa ogni ${weeks} ${weeks===1?"settimana":"settimane"}.`;}
  else {weeks=Math.min(52,Math.max(4,Math.round(52/sess)));
    freqTxt=`Regola pratica: tanti cambi all'anno quante volte giochi a settimana. Con il tuo ritmo circa ogni ${weeks} settimane, o prima se si rompono.`;}
  const next=new Date(); next.setDate(next.getDate()+weeks*7);
  const nextTxt=next.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});

  // consigli stagionali
  const seasonTip={summer:"Giochi soprattutto d'estate all'aperto: il caldo ammorbidisce le corde. Se incordi poco prima di un periodo caldo, resta nella parte alta del range.",
    winter:"Giochi soprattutto d'inverno all'aperto: il freddo irrigidisce le corde. Resta nella parte bassa del range.",
    year:"La stessa tensione si sente diversa tra estate e inverno: d'estate puoi salire di circa 1 kg, d'inverno scendere di circa 1 kg.",
    indoor:"Al coperto la temperatura è più stabile: la sensazione delle corde resta costante più a lungo."}[A("season")];

  // riepilogo per l'incordatore
  const racketLine=info.known?`${info.name} (${info.cm} cm², ${PAT[info.p]})`:`${info.cm?info.cm+" cm²":"piatto non indicato"}, schema ${info.p?PAT[info.p]:"non indicato"}`;
  const topModels=models.kind==="hybrid"
    ? models.items.slice(0,3).map(x=>`${x.m.b} ${x.m.n} + ${x.c.b} ${x.c.n}`)
    : models.items.slice(0,3).map(s=>`${s.b} ${s.n}`);
  const summary=[
    "SCHEDA INCORDATURA · TEORIA DELLE CORDE",
    `Racchetta: ${racketLine}`,
    `Corda: ${TYPES[best].n}`,
    ...lines.map(l=>`${l[0]}: ${l[1]}, ${l[2]}`),
    `Punto di partenza: ${kg(t)} kg`,
    `Modelli da valutare: ${topModels.join("; ")}`,
    compare?`Corda attuale: ${compare.now}`:null,
    `Gioco: ${SURF_L[A("surface")]}, ${SEASON_L[A("season")]}`,
    `Prossimo cambio: ${nextTxt} (circa)`,
    "Nota: consiglio teorico, non una ricetta. Da adattare dopo la prova in campo."
  ].filter(Boolean).join("\n");

  return {info,best,second,ranked,lines,lineNote,gaugeTxt,gaugeSub,gM,gC,t,lo,hi,clamped,conf,confTxt,compare,why,freqTxt,nextTxt,seasonTip,summary,pat,models,ctx};
}

  clearTimeout(advT);
  app.innerHTML="";
  if(step<0) return renderIntro();
  const vis=visible();
  if(step>=vis.length) return renderResult();
  renderQ(vis[step], step, vis.length);
}

function renderIntro(){
  const prog=store.get(KEYP), last=store.get(KEYL);
  const canResume=prog&&prog.ans&&typeof prog.step==="number"&&prog.step>=0;
  let fbHTML="";
  if(last&&!madeThisSession&&!hideFb){
    const when=new Date(last.date).toLocaleDateString("it-IT",{day:"numeric",month:"long"});
    fbHTML = last.fb
      ? `<div class="feedback"><span class="label">La tua ultima scheda · ${when}</span><p><b>${last.label}</b>, ${last.range}. Hai detto: <b>${{dura:"troppo dura",giusta:"giusta",morbida:"troppo morbida"}[last.fb]}</b>. Il prossimo consiglio ne terrà conto.</p></div>`
      : `<div class="feedback"><span class="label">La tua ultima scheda · ${when}</span><p><b>${last.label}</b>, ${last.range}. Com'è andata?</p>
         <div class="row"><button class="btn small ghost" data-fb="dura">Troppo dura</button><button class="btn small ghost" data-fb="giusta">Giusta</button><button class="btn small ghost" data-fb="morbida">Troppo morbida</button><button class="btn small ghost" data-fb="skip">Non l'ho ancora provata</button></div></div>`;
  }
  const node=el(`<section class="card fade stack"><div class="intro">
    <div>
      <h2>Il punto di partenza per le tue corde</h2>
      <p class="muted">Rispondi a qualche domanda su come giochi, sulla tua racchetta e sulle tue sensazioni. Ricevi tipo di corda, calibro, range di tensione in kg, i modelli in commercio adatti a te e quando cambiarli.</p>
      <div class="facts"><div><b>14–18</b><span class="label">domande</span></div><div><b>${STRINGS.length}</b><span class="label">corde di ${BRANDS.length} marche</span></div><div><b>${RACKETS.length}</b><span class="label">racchette in archivio</span></div></div>
      <div class="row"><button class="btn" id="go">Inizia il questionario</button>${canResume?`<button class="btn ghost" id="resume">Riprendi da dove eri</button>`:""}</div>
    </div>
    ${stringbed("16x19","rhybrid","100%")}
  </div>
  <div class="theory"><span class="label">Teoria, non ricette</span><p>I consigli nascono dalla teoria dell'incordatura e dai risultati della ricerca su corde e tensione, applicati alle tue risposte. Non sono ricette: ogni braccio, ogni swing e ogni racchetta reagiscono in modo diverso. Prendili come punto di partenza da provare in campo e da rifinire con il tuo incordatore.</p></div>${fbHTML}${howHTML()}</section>`);
  app.appendChild(node);
  const start=()=>{sessionFb=last&&last.fb?{fb:last.fb,type:last.type}:null;};
  node.querySelector("#go").onclick=()=>{start();ans={};racketQuery="";racketBrand="";step=0;saveProgress();render();};
  const r=node.querySelector("#resume");
  if(r) r.onclick=()=>{start();ans=prog.ans;step=prog.step;render();};
  node.querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.fb;
    if(v==="skip"){hideFb=true;} else {last.fb=v;store.set(KEYL,last);}
    render();
  });
}

function racketButtons(query){
  const qn=norm(query);
  const list=RACKETS.filter(r=>(!racketBrand||r.b===racketBrand)&&(!qn||norm(`${r.b} ${r.n}`).includes(qn)));
  const btns=list.map(r=>`<button class="opt ${ans.racket===r.id?"sel":""}" role="radio" aria-checked="${ans.racket===r.id}" data-v="${r.id}"><b>${r.b} ${r.n}</b><small>${r.cm} cm² · ${PAT[r.p]}${r.ra?` · RA ${r.ra}`:""}</small></button>`).join("");
  return (btns||`<p class="empty">Nessun modello trovato con «${query.replace(/[<>&"]/g,"")}».</p>`)+
    `<button class="opt wide ${ans.racket==="altro"?"sel":""}" role="radio" aria-checked="${ans.racket==="altro"}" data-v="altro"><b>La mia racchetta non c'è</b><small>Ti chiediamo piatto, schema e rigidità</small></button>`;
}

function renderQ(q,i,n){
  const prog=Array.from({length:n},(_,k)=>`<i class="${k<i?"on":k===i?"cur":""}"></i>`).join("");
  const title=qText(q);
  const body = q.type==="racket"
    ? `<input class="search" id="rq" type="search" placeholder="Cerca: Pure Aero, Blade, Speed…" aria-label="Cerca la tua racchetta" value="${racketQuery.replace(/"/g,"&quot;")}" autocomplete="off">
       <div class="chips" id="rb" role="group" aria-label="Filtra per marca"><button class="chipbtn" aria-pressed="${!racketBrand}" data-rb="">Tutte (${RACKETS.length})</button>${RACKET_BRANDS.map(b=>`<button class="chipbtn" aria-pressed="${racketBrand===b}" data-rb="${b}">${b}</button>`).join("")}</div>
       <div class="racket-list" id="rl" role="radiogroup" aria-label="${title}">${racketButtons(racketQuery)}</div>`
    : `<div class="opts${q.compact?" compact":""}" role="radiogroup" aria-label="${title}">
        ${q.o.map(([v,l,s])=>`<button class="opt ${ans[q.id]===v?"sel":""}" role="radio" aria-checked="${ans[q.id]===v}" data-v="${v}"><b>${l}</b>${s?`<small>${s}</small>`:""}</button>`).join("")}
      </div>`;
  const node=el(`<section class="card q fade">
    <div class="progress" aria-hidden="true">${prog}</div>
    <div class="label">Domanda ${i+1} di ${n}</div>
    <h2>${title}</h2>
    ${q.h?`<p class="muted">${q.h}</p>`:""}
    ${body}
    ${q.why?`<p class="why-ask"><b>Perché te lo chiediamo.</b> ${q.why}</p>`:""}
    <div class="row split">
      <button class="btn ghost" id="back">${i===0?"Torna all'inizio":"Indietro"}</button>
      <button class="btn" id="next" ${ans[q.id]?"":"disabled"}>${i===n-1?"Vedi il consiglio":"Avanti"}</button>
    </div></section>`);
  app.appendChild(node);
  const nextBtn=node.querySelector("#next");
  const wire=root=>root.querySelectorAll(".opt[data-v]").forEach(b=>b.onclick=()=>{
    ans[q.id]=b.dataset.v;
    node.querySelectorAll(".opt[data-v]").forEach(x=>{const on=x===b;x.classList.toggle("sel",on);x.setAttribute("aria-checked",on);});
    nextBtn.disabled=false; saveProgress();
    clearTimeout(advT); advT=setTimeout(()=>go(1),450);
  });
  wire(node);
  if(q.type==="racket"){
    const inp=node.querySelector("#rq"), list=node.querySelector("#rl");
    inp.addEventListener("input",()=>{racketQuery=inp.value;list.innerHTML=racketButtons(racketQuery);wire(list);});
    node.querySelectorAll("[data-rb]").forEach(b=>b.onclick=()=>{
      racketBrand=b.dataset.rb;
      node.querySelectorAll("[data-rb]").forEach(x=>x.setAttribute("aria-pressed",x===b));
      list.innerHTML=racketButtons(racketQuery);wire(list);
    });
  }
  node.querySelector("#back").onclick=()=>go(-1);
  nextBtn.onclick=()=>{if(ans[q.id]) go(1);};
}

function go(d){clearTimeout(advT);step+=d;saveProgress();render();}

function modelCard(s,target,first){
  const isPoly=s.t==="poly";
  const tw=isPoly?twuTags(s):null;
  const tags=isPoly?tw.tags:softTags(s);
  const many=s.g.length>1;
  return `<div class="scard${first?" first":""}" data-brands="${s.b}">
    <div class="hd"><span class="label">${s.b}</span><span class="price">${many?"da ":""}${eur(s.p)} a set</span></div>
    <b>${s.n}</b>
    <small>${gaugeLabel(s,target)}</small>
    <div class="tags">${first?`<span class="tagx first">Prima scelta</span>`:""}${tags.map(x=>`<span class="tagx">${x}</span>`).join("")}</div>
    ${isPoly?`<small>${tw.line}</small>`:""}
    <small><a href="${s.src}" target="_blank" rel="noopener">Prezzi e calibri</a></small>
  </div>`;
}
function comboCard(x,gM,gC,first){
  const tw=twuTags(x.c);
  return `<div class="scard${first?" first":""}" data-brands="${x.m.b}|${x.c.b}">
    <div class="hd"><span class="label">${x.m.b===x.c.b?x.m.b:`${x.m.b} + ${x.c.b}`}</span><span class="price">circa ${eur(x.cost)}</span></div>
    <b>${x.m.n} + ${x.c.n}</b>
    <small><b>Verticali:</b> ${x.m.b} ${x.m.n} · ${gaugeLabel(x.m,gM).replace("Calibro ","").replace("Calibro più vicino: ","più vicino ")}</small>
    <small><b>Orizzontali:</b> ${x.c.b} ${x.c.n} · ${gaugeLabel(x.c,gC).replace("Calibro ","").replace("Calibro più vicino: ","più vicino ")}</small>
    <div class="tags">${first?`<span class="tagx first">Prima scelta</span>`:""}${(x.c.twu?tw.tags:softTags(x.c)).map(t=>`<span class="tagx">${t}</span>`).join("")}</div>
    <small>Costo stimato con mezzo set di ciascuna corda.</small>
  </div>`;
}

function renderResult(){
  const r=compute(), T=TYPES[r.best], info=r.info;
  madeThisSession=true;
  store.del(KEYP);
  store.set(KEYL,{type:r.best,label:T.n,range:`${kg(r.lo)}–${kg(r.hi)} kg`,date:new Date().toISOString(),fb:null});
  const okScores=r.ranked.filter(x=>!x.out).map(x=>x.s);
  const max=Math.max(...okScores), min=Math.min(...okScores);
  const pct=s=>Math.round(15+85*(s-min)/Math.max(1,max-min));
  const legend = T.mode==="hybrid"
    ? `<div class="legend"><span><i style="background:var(--court)"></i>Verticali: poliestere</span><span><i style="background:var(--cross)"></i>Orizzontali: corda morbida</span></div>`
    : T.mode==="rhybrid"
    ? `<div class="legend"><span><i style="background:var(--cross)"></i>Verticali: corda morbida</span><span><i style="background:var(--court)"></i>Orizzontali: poliestere</span></div>` : "";
  const third = info.known
    ? `<div><span class="label">Racchetta</span><b>${PAT[info.p]}</b><small>${info.name} · ${info.cm} cm²</small></div>`
    : `<div><span class="label">Schema</span><b>${info.p?PAT[info.p]:"—"}</b><small>${info.p?"verticali × orizzontali":"verifica sul telaio"}${info.cm?` · ${info.cm} cm²`:""}</small></div>`;
  const S2=r.second?TYPES[r.second]:null;
  const srcs=SOURCES.filter(([n])=>A("pain")!=="no"||!n.startsWith("Mohandhas"));
  const M=r.models;
  const cards = M.kind==="hybrid"
    ? M.items.map((x,i)=>comboCard(x,r.gM,r.gC,i===0))
    : M.items.map((s,i)=>modelCard(s,r.gM,i===0));
  const brandsIn=[...new Set(M.kind==="hybrid"?M.items.flatMap(x=>[x.m.b,x.c.b]):M.items.map(s=>s.b))];
  const capTxt={low:"fino a 10 €",mid:"fino a 20 €",high:"fino a 40 €",top:"senza limite",reel:"senza limite di prezzo"}[A("budget")];
  const node=el(`<section class="card fade" style="display:flex;flex-direction:column;gap:26px">
    <div class="res-head">
      <div>
        <div class="pills"><span class="pill">La tua incordatura</span><span class="chip ${r.conf}">Affidabilità ${r.conf}</span></div>
        <h2>${T.n}</h2>
        <p class="muted">${T.d}</p>
        ${legend}
      </div>
      ${stringbed(r.pat,T.mode,170)}
    </div>

    <div class="specs">
      <div><span class="label">Tensione</span><b>${kg(r.lo)}–${kg(r.hi)} kg</b><small>punto di partenza ${kg(r.t)} kg</small></div>
      <div><span class="label">Calibro</span><b>${r.gaugeTxt}</b><small>${r.gaugeSub}</small></div>
      ${third}
    </div>

    <div class="theory"><span class="label">Teoria, non ricette</span><p>Questo consiglio applica la teoria dell'incordatura e i risultati della ricerca alle tue risposte. Non è una ricetta: provalo in campo per qualche ora e rifiniscilo con il tuo incordatore, che vede come reagiscono la tua racchetta e il tuo braccio.</p><p>${r.confTxt}</p></div>

    <div class="sect"><h3>Come montarla</h3>
      <div class="lines">${r.lines.map(l=>`<div class="line-row"><span class="lbl label">${l[0]}</span><span>${l[1]}</span><span>${l[2]}</span></div>`).join("")}</div>
      <div class="note">${r.lineNote}</div>
    </div>

    <div class="sect"><h3>Modelli in commercio per te</h3>
      <p class="muted" style="font-size:.9rem">${M.kind==="hybrid"?"Abbinamenti":"Corde"} di ${brandsIn.length} marche, ordinati per il tuo profilo, con il calibro più vicino a quello consigliato. Budget: ${capTxt}.${M.overBudget?" Nessun modello rientra nel budget: ti mostriamo i più vicini.":""}</p>
      <div class="chips" role="group" aria-label="Filtra per marca">
        <button class="chipbtn" aria-pressed="true" data-brand="">Tutte</button>
        ${brandsIn.map(b=>`<button class="chipbtn" aria-pressed="false" data-brand="${b}">${b}</button>`).join("")}
      </div>
      <div class="scards" id="scards">${cards.join("")}</div>
      ${cards.length>6?`<button class="btn ghost small" id="more" style="align-self:flex-start">Mostra tutti (${cards.length})</button>`:""}
      ${S2?`<div class="box"><span class="label">Seconda scelta</span><b>${S2.n}</b><small>${S2.alt}</small></div>`:""}
      <p class="muted" style="font-size:.82rem">Prezzi dei set da 12 m su Tennis Warehouse Europe a ottobre 2026: possono cambiare e variano tra i negozi. Le etichette sui poliestere vengono dalle misure della TWU.</p>
    </div>

    <div class="sect"><h3>La tensione nel range</h3>
      ${tensionBar(r.lo,r.hi,r.t,info.range)}
      <div class="legend"><span><i style="background:var(--ball)"></i>Range consigliato</span>${info.range?`<span><i class="dash"></i>Range del produttore, ${info.range[0]}–${info.range[1]} kg</span>`:`<span>Scegli il modello di racchetta per vedere il range del produttore</span>`}</div>
    </div>

    ${r.compare?`<div class="sect"><h3>Rispetto a ora</h3><div class="compare">
      <div class="box"><span class="label">Adesso</span><b>${r.compare.now}</b></div>
      <div class="box"><span class="label">Consiglio</span><b>${r.compare.change}</b>${r.compare.tline?`<small>${r.compare.tline}</small>`:""}</div>
    </div></div>`:""}

    <div class="sect"><h3>Perché questa scelta</h3><ul class="why">${r.why.map(w=>`<li>${w}</li>`).join("")}</ul></div>

    <div class="sect"><h3>Compatibilità con gli altri tipi</h3>
      <div class="bars">${r.ranked.map((x,i)=>x.out
        ? `<div class="bar out" title="${x.out}"><span>${TYPES[x.k].s}</span><div class="track"><div class="fill" style="width:6%"></div></div><span>esclusa</span></div>`
        : `<div class="bar ${i===0?"top":""}"><span>${TYPES[x.k].s}</span><div class="track"><div class="fill" style="width:${pct(x.s)}%"></div></div><span>${pct(x.s)}</span></div>`).join("")}</div>
      ${r.ranked.some(x=>x.out)?`<p class="muted" style="font-size:.85rem">Escluse: ${[...new Set(r.ranked.filter(x=>x.out).map(x=>x.out))].join("; ")}.</p>`:""}
    </div>

    <div class="sect"><h3>Quando ricambiarle</h3><p>${r.freqTxt}</p><p><b>Prossimo cambio: ${r.nextTxt} (circa).</b></p></div>

    <div class="sect"><h3>Clima e conservazione</h3>
      ${r.seasonTip?`<p>${r.seasonTip}</p>`:""}
      <p>Non lasciare la racchetta in auto al sole: il calore dopo l'incordatura fa perdere molta più tensione, secondo i test della TWU.</p>
    </div>

    ${A("pain")!=="no"?`<div class="note">Se il dolore persiste, la corda da sola non basta. Fai valutare peso, rigidità e misura del manico della racchetta (un manico troppo piccolo è un fattore di rischio) e confrontati con un medico o un fisioterapista.</div>`:""}

    <div class="row">
      <button class="btn ball" id="copy">Copia la scheda per l'incordatore</button>
      <button class="btn ghost" id="redo">Rifai il questionario</button>
      <button class="btn ghost" id="edit">Modifica le risposte</button>
    </div>
    <pre id="sum" hidden style="white-space:pre-wrap;font:500 .85rem var(--mono);background:var(--court-soft);padding:12px;border-radius:8px;margin:0"></pre>

    <div class="src"><span class="label">Fonti del consiglio</span><ul>
      ${srcs.map(([n,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${n}</a></li>`).join("")}
      ${info.known?`<li><a href="${info.src}" target="_blank" rel="noopener">Scheda tecnica ${info.name}</a></li>`:""}
    </ul></div>
    ${howHTML()}
  </section>`);
  app.appendChild(node);

  // filtro per marca e "mostra tutti"
  const cardEls=[...node.querySelectorAll("#scards .scard")];
  let brandSel="", expanded=false;
  const applyFilter=()=>{
    cardEls.forEach((c,i)=>{
      const match=!brandSel||c.dataset.brands.split("|").includes(brandSel);
      c.hidden=!match||(!brandSel&&!expanded&&i>=6);
    });
    const more=node.querySelector("#more");
    if(more) more.hidden=!!brandSel||expanded;
  };
  node.querySelectorAll(".chipbtn").forEach(b=>b.onclick=()=>{
    brandSel=b.dataset.brand;
    node.querySelectorAll(".chipbtn").forEach(x=>x.setAttribute("aria-pressed",x===b));
    applyFilter();
  });
  const more=node.querySelector("#more");
  if(more) more.onclick=()=>{expanded=true;applyFilter();};
  applyFilter();

  node.querySelector("#sum").textContent=r.summary;
  node.querySelector("#redo").onclick=()=>{ans={};racketQuery="";racketBrand="";step=-1;render();window.scrollTo(0,0);};
  node.querySelector("#edit").onclick=()=>{step=0;saveProgress();render();window.scrollTo(0,0);};
  node.querySelector("#copy").onclick=async e=>{
    const b=e.currentTarget;
    try{await navigator.clipboard.writeText(r.summary);b.textContent="Scheda copiata";}
    catch(_){const p=node.querySelector("#sum");p.hidden=false;const s=getSelection(),rg=document.createRange();rg.selectNodeContents(p);s.removeAllRanges();s.addRange(rg);b.textContent="Seleziona e copia il testo qui sotto";}
  };
  window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
