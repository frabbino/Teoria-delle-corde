<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagina non trovata · Teoria delle Corde</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--FONTS-->
<style>
:root{
  --bg:#eef2f6;--paper:#ffffff;--ink:#10233a;--muted:#5a6b80;--line:#d3dce6;--court:#1d4f8c;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c1622;--paper:#132233;--ink:#e6edf5;--muted:#93a4b8;--line:#25384d;--court:#7fb0ef;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,2.8rem);line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);text-decoration:none;align-self:flex-start}
.brand span{color:var(--court)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,32px);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.4rem);line-height:1.05;margin:0;text-transform:uppercase}
p{margin:0;max-width:65ch}
.btn{display:inline-block;border-radius:999px;padding:12px 22px;font:600 1rem var(--body);background:var(--court);color:var(--paper);text-decoration:none}
.btn:focus-visible,.brand:focus-visible{outline:3px solid var(--court);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">Teoria<br><span>delle corde</span></a>
  <main class="card">
    <span class="label">Errore 404</span>
    <h1>Pagina non trovata</h1>
    <p>La pagina che cerchi non esiste o è stata spostata. Il questionario è sempre nella pagina principale.</p>
    <a class="btn" href="/">Vai al questionario</a>
  </main>
</div>
</body>
</html>
